<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Whistle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Whistle">
<meta name="theme-color" content="#f7f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="herd" class="view">
    <header class="herd-head">
      <div class="t"><h1>Spaces</h1><span class="count" id="count">Connecting…</span><button class="add" id="new-space" aria-label="New space">+</button></div>
      <div class="sessions" id="sessions" role="group" aria-label="herdr sessions"></div>
    </header>
    <div class="scroll" id="herd-scroll">
      <section id="g-asking" hidden><div class="grp"><span>Asking you</span></div><div class="cards" id="asking"></div></section>
      <section id="g-active" hidden><div class="grp"><span>Active</span></div><div class="wides" id="active"></div></section>
      <section id="g-spaces"><div class="grp"><span id="quiet-h">Quiet</span></div><div class="tiles" id="tiles"></div></section>
      <section id="g-hidden" hidden><button class="hidden-t" id="hidden-t" aria-expanded="false"></button><div class="tiles" id="hidden" hidden></div></section>
      <p class="hint" id="hint">Long-press a space to hide or delete it.</p>
    </div>
  </main>

  <main id="space" class="view" hidden>
    <header class="nav">
      <button class="back" id="sp-back" aria-label="Back to spaces">‹ Spaces</button>
      <div class="ttl"><b id="sp-title"></b><span id="sp-sub"></span></div>
    </header>
    <div class="scroll" id="sp-scroll">
      <button class="newagent" id="sp-new"><span>+</span> New agent</button>
      <div class="cards" id="sp-list"></div>
    </div>
  </main>

  <main id="session" class="view" hidden>
    <header class="nav">
      <button class="back" id="back" aria-label="Back to the space">‹ Back</button>
      <div class="ttl"><b id="s-title"></b><span id="s-sub"></span></div>
      <span class="pill" id="s-pill"></span>
    </header>
    <div class="scroll" id="s-scroll"><div id="s-body"></div></div>
    <footer class="dock" id="dock">
      <div class="queued" id="s-queue"></div>
      <div class="row" id="s-chips"></div>
      <div class="attached" id="s-attached"></div>
      <form class="composer" id="composer">
        <button type="button" class="ic attach" id="attach" aria-label="Attach screenshots"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
        <input type="file" id="files" accept="image/*" multiple hidden>
        <textarea id="draft" rows="1" placeholder="Say something…" enterkeyhint="send" autocomplete="off"></textarea>
        <button class="ic send" id="send" aria-label="Send">↑</button>
      </form>
    </footer>
  </main>

  <div id="toast" class="toast" hidden></div>
  <div id="ptr" class="ptr" hidden>Pull to refresh</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
